---
layout: default
---
<h1 class="sr-only">{{ site.title }}</h1>
<div class="home-layout">
<div class="home-intro prose">{{ content }}</div>
<img class="home-portrait" src="{{ '/assets/images/antone-king.jpg' | relative_url }}" alt="Antone King holding a piglet in a barn" width="720" height="960">
<div class="home-links">
<section class="home-directory" aria-labelledby="projects-heading">
  <h2 id="projects-heading">Projects</h2>
  <ul>
    {% for project in site.data.projects %}
    <li>{% if project.external_url %}<a href="{{ project.external_url | escape }}">{{ project.title | escape }}</a>{% else %}{{ project.title | escape }}{% endif %}</li>
    {% endfor %}
  </ul>
</section>
<section class="home-directory" aria-labelledby="writing-heading">
  <h2 id="writing-heading">Writing</h2>
  {% include writing-list.html compact=true %}
</section>
</div>
</div>

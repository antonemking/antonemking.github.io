<ul class="project-list">
  {% for project in site.data.projects %}
  <li>
    <div class="entry-heading">
      <h3><a href="{{ project.url | relative_url }}">{{ project.title }} <span aria-hidden="true">↗</span></a></h3>
      <span class="entry-date">{{ project.status }}</span>
    </div>
    <p class="entry-type">{{ project.category }}</p>
    <p>{{ project.summary }}</p>
  </li>
  {% endfor %}
</ul>
